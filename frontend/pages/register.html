<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up – Rahul Notes Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/global.css">
<style>
body { background: var(--navy); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.auth-box { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-logo .logo-icon { width: 52px; height: 52px; font-size: 26px; margin: 0 auto 10px; }
.auth-logo h2 { font-family: 'Playfair Display', serif; font-size: 22px; }
.auth-logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.perks { background: var(--paper); border-radius: 10px; padding: 14px; margin-bottom: 22px; }
.perk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 3px 0; }
.auth-footer { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
.auth-footer a { color: var(--saffron); font-weight: 500; }
</style>
</head>
<body>
<script src="/assets/js/app.js"></script>
<div class="auth-box">
  <div class="auth-logo">
    <div class="logo-icon">R</div>
    <h2>Create Free Account</h2>
    <p>Join 50,000+ UPSC aspirants today</p>
  </div>

  <div class="perks">
    <div class="perk">✅ Access 840+ free notes instantly</div>
    <div class="perk">📚 Track your downloaded notes</div>
    <div class="perk">🛒 Secure payment & instant access</div>
  </div>

  <div class="form-group">
    <label class="form-label">Full Name</label>
    <input class="form-input" type="text" id="name" placeholder="Priya Sharma" />
  </div>
  <div class="form-group">
    <label class="form-label">Email Address</label>
    <input class="form-input" type="email" id="email" placeholder="you@example.com" />
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input class="form-input" type="password" id="password" placeholder="Minimum 6 characters" />
    <div class="form-hint">Use a strong password with letters and numbers</div>
  </div>

  <button class="btn btn-saffron btn-full btn-lg" id="regBtn" onclick="doRegister()">Create My Account →</button>

  <div class="auth-footer" style="margin-top:16px">Already have an account? <a href="/pages/login.html">Login</a></div>
  <div class="auth-footer" style="margin-top:8px"><a href="/index.html">← Back to Browse</a></div>
</div>

<script>
async function doRegister() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('regBtn');
  if (!name || !email || !password) { toast('Fill all fields', 'error'); return; }
  if (password.length < 6) { toast('Password too short', 'error'); return; }
  btn.textContent = 'Creating account…'; btn.disabled = true;
  try {
    const data = await apiFetch('/auth/register', { method: 'POST', body: { name, email, password } });
    Auth.setAuth(data.token, data.user);
    toast('Welcome to Rahul Notes Hub! 🎉', 'success');
    setTimeout(() => window.location.href = '/index.html', 900);
  } catch (e) {
    toast(e.message, 'error');
    btn.textContent = 'Create My Account →'; btn.disabled = false;
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
if (Auth.isLoggedIn()) window.location.href = '/index.html';
</script>
</body>
</html>
